<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positioning blocks</title>

    <style>

      body{
        height: 2000px;
      }

      .boxes {
        border: 2px solid black;
        width: 270px;
        height: 200px;
        display: inline-flex;
      }

      .box1 {
        background-color: cyan;
        position: sticky;
        top: 0px;
        margin-bottom: 400px;
      }


      .box2 {
        background-color: yellow;
         position: sticky;
        top: 0px;
        margin-bottom: 200px;
      }
      .box3 {
        background-color: green;
         position: sticky;
        top: 0px;
        margin-top: 0px;
      }
      .box4 {
        background-color: azure;
         position: sticky;
        top: 0px;
        margin-bottom: 200px;
      }
      
      .box5 {
        background-color: red;
         position: sticky;
        top: 0px;
        margin-bottom: 400px;
      }

    </style>
  </head>

  <body>
      <div class="boxes box1"></div>
      <div class="boxes box2"></div>
      <div class="boxes box3"></div>
      <div class="boxes box4"></div>
      <div class="boxes box5"></div>
  </body>
</html>
