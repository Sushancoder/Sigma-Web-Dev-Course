<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
.boxes{
    border: 2px solid black;
    display: grid;
    /* grid-template-areas is used to create rows and columns according to the need by specifying the names of the areas */
    /* here areas are named as 'nav' 'aside' 'main' 'footer' 'about' */
    /* the columns are created using the names of the areas and if you want more than one column use a space to separate the names of the areas as shown below */
    /* the rows are created by comma separating the names of the areas as shown below */
    /* for more info C:\Users\Neha\OneDrive\Documents\Html websites\CWH sigma test\Css grid areas.jpeg */
    grid-template-areas: 'nav nav nav ' 'aside main main' 'footer footer about';
}
.box{
    /* we can see the same thing as the image shown above by removing the height and width */
    /* height: 50px;
    width: 50px; */
    border: 2px solid black;
    font-size: 30px;
}

#one{
    background-color: red;
    /* we use the grid-area to specify that which area the element should be placed */
    /* here we have placed the element with id one in the nav area */
    grid-area: nav;

}
#two{
    background-color: blue;
    grid-area: aside;
}
#three{
    background-color: green;
    grid-area: main;
}
#four{
    background-color: yellow;
    grid-area: footer;
}
#five{
    background-color: purple;
    grid-area: about;
}


    </style>
</head>
<body>
    <div class="boxes">
        <div class="box" id="one">nav</div>
        <div class="box" id="two">aside</div>
        <div class="box" id="three">main</div>
        <div class="box" id="four">footer</div>
        <div class="box" id="five">about</div>
    </div>
</body>
</html>
