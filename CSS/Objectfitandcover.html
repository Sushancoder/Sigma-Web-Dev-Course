<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS object fit and object cover
  </title>
  <style>
    .frame{
      height: 400px;
      width: 400px;
      border: 2px solid black;
      /* background-color: azure; */
      /* we can also set an image as the background of the box as shown below*/
      background-image: url(https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D) ;
      /* Here all the properties is as same as object-postion but you also have here x and y axis:
      
      it works just like the object-position tag which is used to change the part of the image that is shown */
      /* you can set x and y axis separately as shown below */
      /* background-position-x: center;
      /* background-position-y: center;* */
      /* you can also use the short hand for the background-position as shown below */
      background-position: center center;

      /* You can change the location of the image using the background-position: 15px 10px; here you can put-
      a positive value for 15px if you want to align it through left
      a negative value for 15px if you want to align it through right
      a positive value for 10px if you want to align it through top
      a negative value for 10px if you want to align it through bottom
      an example for it is shown below */
      background-position: 100px -300px;
      /* you can also set them(x and y axis) separately as shown below
      background-position-x: 100px;
      background-position-y: 100px; */

      /* By default an image repeats itself in both x and y axis but you can change it */
      /* You can change them separately as shown below */
      /* background-repeat: repeat-x; will repeat the image only in x axis */
      /* background-repeat: repeat-y; will repeat the image only in y axis */
      /* background-repeat: repeat-x repeat-y; will repeat the image in both axis */
      /* background-repeat: no-repeat; will not repeat the image only in any axis */
      /* background-repeat: no-repeat; */
    }
    img{
      height: 400px;
      width: 400px;
      /* it specifies how the image should be placed in the container */
      /* by default object-fit is set to fill which means to fill the image in the given dimensions(here: height: 400px; and width:400px;) even though the aspect ratio of the image is changed  */
      /* object-fit: fill; */

      /* object-fit: cover; is used to  fit the object in the given area by selecting a specific part of the image(usually it shows the center part)
      You can select other part of the image than center by using the object-position:left/right/top left/etc;  */
      /* object-fit: cover; */

      /* object-fit: contain; fits the object in the given dimensions neither by changing the aspect ratio nor showing any specific part of the image */
      object-fit: contain;

      /* here the object position is set to center */
      object-position: center;

      /* You can change the location of the image using the object-position: 15px 10px; here you can put-
      a positive value for 15px if you want to align it through left
      a negative value for 15px if you want to align it through right
      a positive value for 10px if you want to align it through top
      a negative value for 10px if you want to align it through bottom
      an example for it is shown below
      you can understand it better with object-fit:contain; as it shows the whole image
      it is just like margin but it is a better option to align an image */
      object-position: -10px 50px;
      /* you can also set it as percentage as shown below */
      object-position: 50% 50%;

      /* here is why we don't use the margin proprties as it takes the image out of the parent container as you can see below */
      /* margin-top: 110px; */
    }
    /* img:hover{
      object-fit: none;
      object-position: center;
    } */
  </style>
</head>
<body>
  <div class="frame">
    <img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" alt="Image">
  </div>
</body>
</html>
