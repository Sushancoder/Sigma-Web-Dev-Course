<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Transform</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .box {
        height: 50px;
        width: 50px;
        background-color: beige;
        border: 2px solid black;

        /* ROTATE */
        /* transform rotate is used to rotate the element on the basis of angle */
        /* normally by the normal syntax it applies on the x axis if the syntax is as shown below*/
        /* it mainly uses two units 1. deg, 2. turn */
        /* deg rotates the element in specifies degrees */
        /* transform: rotate(90deg); */

        /* turn rotates the element in specified number of turns */
        /* transform: rotate(0.25turn); */

        /* any one of the following will work at once */
        /* rotateX is used to rotate the element in X axis */
        /* transform: rotateX(34deg); */
        /* rotateY is used to rotate the element in Y axis */
        /* transform: rotateY(34deg); */
        /* rotateZ is used to rotate the element in Z axis */
        /* transform: rotateZ(34deg); */

        /* ORIGIN */
        /* transform-origin states the point of origin for the transform property which means that from where the trasform property will be applied 
        normally by the normal syntax it is center of the element which is set to 50% 50%*/
        /* transform-origin: 50% 50%; */

        /* SCALE */
        /* scale is used to increase or decrease the size of the element */
        /* here the element is increased by 2 times */
        /* normally by the normal syntax it applies on both axis like as shown below */
        /* transform: scale(2); */

        /* any one of the following will work at once */
        /* scaleX is used to increase or decrease the size of the element in X axis */
        /* transform: scaleX(2); */
        /* scaleY is used to increase or decrease the size of the element in Y axis */
        /* transform: scaleY(3); */
        /* there is no scaleZ property in CSS */


        /* SKEW */
        /* In CSS, skew means to transform an element in the 2D plane by picking a point and pushing or pulling it in different directions. The syntax for the skew() function is skew( ax ) or skew( ax, ay ).  */
        /* normally by the normal syntax it applies on X axis if the syntax is as shown below*/
        /* transform: skew(34deg); */

        /* any one of the following will work at once */
        /* skewX is used to skew the element in X axis */
        /* transform: skewX(40deg); */
        /* skewY is used to skew the element in Y axis */
        /* transform: skewY(10deg); */


        /* TRANSLATE */
        /* In CSS, the translate() function moves elements in a two-dimensional space. It moves the position of the element on the plane by the amount provided by tx and ty. The translate() function accepts two arguments, indicating how much to move the element along the x and y axes respectively. */

        /* normally by the normal syntax it applies on X axis if the syntax is as shown below*/
        /* transform: translate(10px); */
        /* but we can apply it on both axis by the following syntax */
        /* transform: translate(100px, 20px); */

        /* any one of the following will work at once */
        /* translateX is used to translate the element in X axis */
        /* transform: translateX(100px); */
        /* translateY is used to translate the element in Y axis */
        /* transform: translateY(100px); */


        /* SHORT-HAND for transform */
        /* We can use all the above properties in one line as shown below*/
        /* transform: translate(100%, 100%) rotate(45deg) skewX(40deg) translateX(45%); */
        /* we can also apply negative property if needed of the aboev property */

        /* the following syntax is to align the content in the box */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        margin: 55px;
        width: 100vw;
        height: 80vh;
        border: 2px solid purple;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="box">Box</div>
    </div>
  </body>
</html>
