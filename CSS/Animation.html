<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations in CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .container{
            height: 50vh;
            width: 60vw;
            background-color: aqua;
        }
        .box{
            height: 10vh;
            width: 6vw;
            background-color: red;
            /* it is used to link the name of the animation function to the element */
            /* animation-name: anime; */

            /* it sets the duration of the animation */
            /* animation-duration: 4s; */

            /* it sets the type of animation */
            /* you can create your own animation-timing-function like 
            animation-timing-function:cubic-bezier(1, 0.09, 0.09, 0.94);*/
            /* animation-timing-function: ease-in-out; */

            /* it sets that after how much time the animation will start after input */
            /* animation-delay: 1s; */

            /* it sets from which direction the animation will start */
            /* animation-direction: alternate-reverse will change the animation-direction after each iteration ; */
            /* animation-direction: reverse; */

            /* Defines what values are applied by the animation outside the time it is executing */
            /* animation-fill-mode:; */

            /* defines how many times the function will be applied */
            /* animation-iteration-count: infinite; */

            /* it is used to manipulate the play state of animating element like pause will pause the animation anywhere it is applied
            it is used in javascript */
            /* animation-play-state: paused; */

            /* Short-Hand function for animation */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            /* we can also apply more than one one animation like as shown below */
            animation: anime 4s linear 1s 3 alternate-reverse forwards,
                       anime2 4s linear 1s 3 alternate-reverse forwards;
        }
        @keyframes anime {
            from{
                background-color: red;
            }
            to{
                background-color: blue;
                transform: translate(500px);
            }
        }

        /* there is another way to create animation in CSS */
        /* here we define the changes by percentage */
        @keyframes anime2{
            1%{
                background-color: rgb(255, 102, 0, 0.719);
            }
            20%{
                background-color: yellow;
                transform: translateX(200px);
            }
            40%{
                background-color: green;
                transform: translateX(400px);  
            }
            60%{
                background-color: blue;
                transform: translateX(600px);   
            }
            80%{
                background-color: brown;
                transform: translateX(800px);
            }
            100%{
                background-color: red;
                transform: translateX(1000px);
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            The Box
        </div>
    </div>
</body>
</html>
