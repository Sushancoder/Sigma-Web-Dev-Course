<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Filter</title>
    <style>
      .img1 {
        /* it is used to blur the image or video */
        filter: blur(3px);

        /* brightness() applies a linear multiplier to the input image, making it appear more or less bright. Values are linear multipliers on the effect, with 0% creating a completely black image, 100% having no effect, and values over 100% brightening the image. */
        filter: brightness(2);

        /* contrast is the
         contrast() adjusts the contrast of the input image. A value of 0% makes the image grey, 100% has no effect, and values over 100% create a contrast. */
        filter: contrast(500%);

        /* drop-shadow() Applies the parameter <shadow> as a drop shadow, following the contours of the image. The shadow syntax is similar to <box-shadow> (defined in the CSS backgrounds and borders module), with the exception that the inset keyword and spread parameter are not allowed. As with all filter property values, any filters after the drop-shadow() are applied to the shadow. */
        filter: drop-shadow(16px 16px 10px black);

        /* grayscale() Converts the image to grayscale. A value of 100% is completely grayscale. The initial value of 0% leaves the input unchanged. Values between 0% and 100% produce linear multipliers on the effect. */
        filter: grayscale(60%);

        /* hue-rotate() Applies a hue rotation. The <angle> value defines the number of degrees around the hue color circle at which the input samples will be adjusted. A value of 0deg leaves the input unchanged. */
        filter: hue-rotate(44deg);

        /* invert() Inverts the samples in the input image. A value of 100% completely inverts the image. A value of 0% leaves the input unchanged. Values between 0% and 100% have linear multipliers on the effect. */
        /* 50% makes the image dissapear as both are 50-50 */
        filter: invert(60%);

        /* opacity() Applies transparency. 0% makes the image completely transparent and 100% leaves the image unchanged. */
        filter: opacity(50%);

        /* saturate() Saturates the image, with 0% being completely unsaturated, 100% leaving the image unchanged, and values of over 100% increasing saturation. */
        filter: saturate(10%);

        /* sepia() Converts the image to sepia, with a value of 100% making the image completely sepia and 0% making no change. */
        filter: sepia(70%);

        /*You can use all the properties of filter function in a single line as follow */
        filter: contrast(175%) brightness(103%);
      }
      .vd {
        /* You can also apply all the above properties in video*/
        filter: blur(2px) grayscale(60%) invert(60%);
      }
      .img2 {
        /* here is a good example of a use case of filter fumction */
        border: 1px solid blue;
        filter: drop-shadow(5px 5px 0 red) hue-rotate(180deg) drop-shadow(5px 5px 0 red);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <video
        src="pexels-karolina-grabowska-5795043 (360p).mp4"
        controls
        class="vd"></video>
      <img
        src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D"
        alt=""
        class="img1" />
      <img
        src="https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885_1280.jpg"
        alt=""
        class="img2" />
      <img
        src="https://helpx.adobe.com/content/dam/help/en/photoshop/using/convert-color-image-black-white/jcr_content/main-pars/before_and_after/image-before/Landscape-Color.jpg"
        alt=""
        class="img3" />
    </div>
  </body>
</html>
