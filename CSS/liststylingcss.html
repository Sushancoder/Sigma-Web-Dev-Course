<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Shadows</title>

    <style>
      * {
        padding: 0;
        margin: 1px;
      }
      div ul li {
        background-color: cyan;
        border: 2px dotted black;
        /* list-style-position: inside; */
        list-style-type: "🌍" inside; 

        /* the inside attribute does not work here in list-style-type but works in list-style. */

        margin: 0px 100px;
        list-style: "🌍" inside  url(https://user-images.githubusercontent.com/14011726/94132137-7d4fc100-fe7c-11ea-8512-69f90cb65e48.gif); 

         /* this only works in list-style not in list-style-type */

        list-style: devanagari;
        list-style-type: devanagari;
        /* list-style-image: url(https://user-images.githubusercontent.com/14011726/94132137-7d4fc100-fe7c-11ea-8512-69f90cb65e48.gif); */
        
      }

      /* .harry {
        background-color: aquamarine;
        border: 2px dotted brown;
        list-style-position: inside;
        list-style-image: url(https://yt3.googleusercontent.com/ytc/APkrFKZGyiFJtoR2Isio_S591bOWpCKBFaIzqSuAG56ubA=s176-c-k-c0x00ffffff-no-rj);
      } */
    </style>
  </head>

  <body>
    <div>
      <ul>
        <li class="harry">Item 1</li>
        <li>Item 2</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
        <li>item 3</li>
      </ul>
    </div>
  </body>
</html>
