<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selectors in CSS</title>
  </head>
  <style>
    /* Element Selector  */
    div {
      /* background-color: red; */
    }

    /* Class Selector  */
    .red {
      background-color: red;
    }

    /* Id Selector */
    #green {
      background-color: green;
    }

    /* Child Selectors  */
    /* selects the specified element if it is directly present after div element */
    div > p {
      color: blue;
      background-color: brown;
    }

    /* Descendant Selector  */
    /* selects specified element anywhere under div element */

    div p {
      color: blue;
      background-color: brown;
    }

    /* Universal Selector */
    * {
      margin: 0;
      padding: 0;
    }

    /* Pseudo Selector  */
    a:visited {
      color: yellow;
    }

    /* specifying what to do with the link */
    a:link {
      color: green;
    }

    /* specifying what to do when the user clicks on the link */
    a:active {
      background-color: red;
    }

    /* specifying what to do when the user hovers on the link */
    a:hover {
      background-color: yellow;
    }

    /* selecting the first child */
    p:first-child {
      background-color: aqua;
    }

    .box:first-child{
            background-color: red;
        }

/* selecting the first line */
    .box::first-line{
            color: yellow;
        }

/* selects all elements under the box class */
    .boxes *{
            color: blue;
            border: 2px solid black;
        }

        /* selects many the elements with comma seperation which specify any condition present within the comma */
        p, a, .box, [data-color="primary"]{
            padding-top: 45px;
        }

        /* selects only the odd elements */
    .box:nth-child(odd){
            background-color: blue;
        }

        /* selects the second/specified element starting from the end */
    .box:nth-last-child(2){
            background-color: red;
        }

/* used to provide content before the specified element */
    .boxes::before {
      content: "Harry is good";
      color: blue;
    }
/* used to provide content after the specified element */
    .boxes::after {
      content: "Sigma course is also good";
      color: red;
    }

    /* specifies what to happen if the user selects the text */
    /* if we dont specify the element before the pseudo selector then it applys the style to the all elements  */
    ::selection {
      background-color: black;
      color: aqua;
    }

    /* specifies the first letter of the element text */
    .box::first-letter {
      color: peru;
      font-size: 45px;
    }
    
/*  used to specify the elements under the input tag like here placeholder is specified */
    input::placeholder {
      color: rgb(84, 84, 88);
    }
  </style>
  <body>
    <div class="boxes">
      <div data-color="primary" class="box">I am first box</div>
      <div class="box">Hey I am a box</div>
      <div class="box">Hey I am a box</div>
      <input type="text" placeholder="Type your name here" />
    </div>
  </body>
</html>
